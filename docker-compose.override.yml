services:
  # ---------------------------------------------------------------------------
  # FastAPI REST API Backend — Auto-reload enabled
  # ---------------------------------------------------------------------------
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    environment:
      - WATCHFILES_FORCE_POLLING=true

  # ---------------------------------------------------------------------------
  # Celery Asynchronous Background Worker — Auto-reload via watchfiles
  # ---------------------------------------------------------------------------
  worker:
    command: ["watchfiles", "--filter", "python", "celery -A app.workers.celery_app.celery_app worker --loglevel=info", "/app"]
    environment:
      - WATCHFILES_FORCE_POLLING=true

  # ---------------------------------------------------------------------------
  # React + TypeScript + Vite Frontend — Dev server with HMR and polling watch
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports: !override
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_USE_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
