# yaml-language-server: $schema=https://api.icepanel.io/v1/schemas/LandscapeImportData
namespace: email-monitoring-system
modelObjects:
  - id: domain-1
    name: Email Monitoring System
    type: domain
    caption: Standalone Email Monitoring and Management Platform
    description: A comprehensive platform for monitoring, managing, and orchestrating email communications across multiple accounts and domains with team collaboration features.

  - id: actor-1
    name: End User
    type: actor
    parentId: domain-1
    caption: Application user
    description: Individuals who use the platform to manage email accounts, compose messages, and monitor email campaigns.

  - id: system-1
    name: Email Monitoring Platform
    type: system
    parentId: domain-1
    caption: Core platform system
    description: The main software system providing email monitoring, management, and campaign orchestration capabilities.
    icon:
      technologyId: 4QZq23Fxy9oyoCTmURM6
    technologyIds:
      - 4QZq23Fxy9oyoCTmURM6
    links:
      - url: https://github.com/dipak/Email_Monitoring
        customName: Source code

  - id: app-1
    name: React Frontend SPA
    type: app
    parentId: system-1
    caption: User interface application
    description: React-based single-page application providing the user interface for email management, dashboard, and configuration.
    icon:
      technologyId: 9ZYWgwsvAwKsjKK8lNgg
    technologyIds:
      - 9ZYWgwsvAwKsjKK8lNgg
      - unq9eBvtMu9rTTSQqqUP
      - RGGR8ElsMwiF1HjOmLMm
